services:
  - type: web
    name: fluxion
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fluxion-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: GIN_MODE
        value: release
      - key: STATIC_DIR
        value: /app/web/dist

databases:
  - name: fluxion-db
    plan: free
    region: singapore
    databaseName: go_flow
    user: go_flow
    ipAllowList: []
